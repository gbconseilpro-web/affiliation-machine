<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="150" r="200" fill="white" fill-opacity="0.04"/>
  <circle cx="1080" cy="120" r="130" fill="white" fill-opacity="0.05"/>
  <circle cx="150" cy="500" r="150" fill="white" fill-opacity="0.04"/>

  <!-- Main card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Logo icon -->
  <rect x="130" y="130" width="64" height="64" rx="16" fill="#4f46e5"/>
  <rect x="130" y="130" width="64" height="64" rx="16" fill="white" fill-opacity="0.15"/>
  <!-- Checkmark icon -->
  <path d="M152 162 L160 170 L178 152" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Site name -->
  <text x="210" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white">FacturationPro</text>
  <text x="210" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="white" fill-opacity="0.6">facturationpro.com</text>

  <!-- Main headline -->
  <text x="130" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">Comparatif logiciels de</text>
  <text x="130" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">facturation 2026</text>

  <!-- Subtitle -->
  <text x="130" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="white" fill-opacity="0.75">Guides, avis et comparatifs pour independants et auto-entrepreneurs</text>

  <!-- Tags -->
  <rect x="130" y="450" width="148" height="42" rx="21" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="154" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">Freebe</text>

  <rect x="293" y="450" width="120" height="42" rx="21" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="317" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">Indy</text>

  <rect x="428" y="450" width="158" height="42" rx="21" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="452" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">Pennylane</text>

  <rect x="601" y="450" width="120" height="42" rx="21" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="625" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">Tiime</text>

  <rect x="736" y="450" width="120" height="42" rx="21" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <text x="760" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#6ee7b7">2026</text>

  <!-- Right side decoration - rating badge -->
  <rect x="900" y="200" width="210" height="190" rx="20" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="1005" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" fill-opacity="0.6" text-anchor="middle">Notre meilleure note</text>
  <text x="1005" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="white" text-anchor="middle">4.5</text>
  <text x="1005" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#fbbf24" text-anchor="middle">★★★★★</text>
  <text x="1005" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="white" fill-opacity="0.5" text-anchor="middle">Freebe</text>
</svg>
