  <text x="280" y="419" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">freelances europeens</text>
  <rect x="480" y="368" width="240" height="68" rx="12" fill="#f9fafb"/>
  <text x="600" y="397" font-family="Arial Black,sans-serif" font-size="14" fill="#242424" text-anchor="middle">Cashback</text>
