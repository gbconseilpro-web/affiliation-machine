    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="180" fill="#242424" opacity="0.05"/>
  <circle cx="80" cy="560" r="140" fill="#6b7280" opacity="0.05"/>
  <rect x="0" y="0" width="8" height="630" fill="#242424"/>
