<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <!-- Receipt icon -->
  <rect x="60" y="80" width="160" height="240" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="80" y="110" width="120" height="8" rx="4" fill="#d97706" opacity="0.4"/>
  <rect x="80" y="130" width="90" height="6" rx="3" fill="#92400e" opacity="0.3"/>
  <rect x="80" y="150" width="105" height="6" rx="3" fill="#92400e" opacity="0.3"/>
  <rect x="80" y="170" width="80" height="6" rx="3" fill="#92400e" opacity="0.3"/>
  <line x1="80" y1="195" x2="200" y2="195" stroke="#d97706" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="80" y="210" width="60" height="8" rx="4" fill="#d97706" opacity="0.6"/>
  <rect x="150" y="210" width="50" height="8" rx="4" fill="#d97706" opacity="0.9"/>
  <!-- Camera/scan icon -->
  <circle cx="245" cy="200" r="30" fill="#d97706" opacity="0.15"/>
  <text x="245" y="210" font-family="Arial,sans-serif" font-size="28" text-anchor="middle">📷</text>
  <!-- Arrow -->
  <text x="300" y="208" font-family="Arial,sans-serif" font-size="28" fill="#d97706">→</text>
  <!-- Digital card -->
  <rect x="330" y="130" width="200" height="140" rx="12" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <rect x="330" y="130" width="200" height="40" rx="12" fill="#d97706" opacity="0.1"/>
  <text x="430" y="157" font-family="Arial Black,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Deductible ✓</text>
  <text x="350" y="195" font-family="Arial,sans-serif" font-size="12" fill="#374151">Repas client</text>
  <text x="510" y="195" font-family="Arial,sans-serif" font-size="12" fill="#059669" text-anchor="end">48,50 EUR</text>
  <text x="350" y="218" font-family="Arial,sans-serif" font-size="12" fill="#374151">Transport</text>
  <text x="510" y="218" font-family="Arial,sans-serif" font-size="12" fill="#059669" text-anchor="end">23,00 EUR</text>
  <text x="350" y="241" font-family="Arial,sans-serif" font-size="12" fill="#374151">Logiciel</text>
  <text x="510" y="241" font-family="Arial,sans-serif" font-size="12" fill="#059669" text-anchor="end">15,00 EUR</text>
  <line x1="350" y1="255" x2="510" y2="255" stroke="#e5e7eb" stroke-width="1"/>
  <text x="350" y="272" font-family="Arial Black,sans-serif" font-size="13" font-weight="700" fill="#92400e">Total</text>
  <text x="510" y="272" font-family="Arial Black,sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="end">86,50 EUR</text>
  <!-- Title -->
  <text x="560" y="120" font-family="Arial Black,sans-serif" font-size="22" font-weight="900" fill="#92400e">Notes de frais</text>
  <text x="560" y="148" font-family="Arial,sans-serif" font-size="14" fill="#78350f">Guide complet 2026</text>
  <text x="720" y="440" font-family="Arial,sans-serif" font-size="11" fill="#9ca3af" text-anchor="end">facturationpro.com</text>
</svg>
