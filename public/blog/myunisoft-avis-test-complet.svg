<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#bfdbfe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="180" fill="#3b82f6" opacity="0.07"/>
  <circle cx="80" cy="560" r="140" fill="#1A1A2E" opacity="0.07"/>
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <!-- White card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="white" opacity="0.75"/>
  <!-- MyUnisoft logo -->
  <rect x="300" y="130" width="600" height="90" rx="12" fill="#1A1A2E"/>
  <text x="600" y="195" font-family="Arial Black,sans-serif" font-size="44" font-weight="900" fill="white" text-anchor="middle">MyUnisoft</text>
  <!-- Divider -->
  <rect x="460" y="248" width="280" height="3" rx="2" fill="url(#accent)" opacity="0.6"/>
  <!-- Tagline -->
  <text x="600" y="310" font-family="Arial,sans-serif" font-size="26" fill="#374151" text-anchor="middle">Logiciel comptable pour cabinets et entreprises</text>
  <!-- Features -->
  <rect x="160" y="360" width="240" height="68" rx="12" fill="#eff6ff"/>
  <text x="280" y="389" font-family="Arial Black,sans-serif" font-size="14" fill="#1A1A2E" text-anchor="middle">Comptabilite</text>
  <text x="280" y="411" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">automatisee</text>
  <rect x="480" y="360" width="240" height="68" rx="12" fill="#eff6ff"/>
  <text x="600" y="389" font-family="Arial Black,sans-serif" font-size="14" fill="#1A1A2E" text-anchor="middle">Multi-dossiers</text>
  <text x="600" y="411" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">cabinets</text>
  <rect x="800" y="360" width="240" height="68" rx="12" fill="#eff6ff"/>
  <text x="920" y="389" font-family="Arial Black,sans-serif" font-size="14" fill="#1A1A2E" text-anchor="middle">API ouverte</text>
  <text x="920" y="411" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">et integrateurs</text>
  <!-- Badge -->
  <rect x="460" y="462" width="280" height="44" rx="22" fill="#1A1A2E"/>
  <text x="600" y="490" font-family="Arial Black,sans-serif" font-size="16" fill="white" text-anchor="middle">Avis &amp; Test complet 2026</text>
  <!-- Footer -->
  <text x="1120" y="610" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="end">facturationpro.com</text>
</svg>
