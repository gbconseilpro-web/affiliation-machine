<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3ff"/>
      <stop offset="100%" style="stop-color:#ddd6fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b21b6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="180" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="80" cy="560" r="140" fill="#5b21b6" opacity="0.07"/>
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <!-- White card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="white" opacity="0.75"/>
  <!-- Sellsy logo -->
  <image href="https://cdn.prod.website-files.com/6058a411307dccf59c654f37/69d4b073e2dd0bd8569326c8_TeamSystemSellsy_Color_SVG.svg" x="300" y="130" width="600" height="96"/>
  <!-- Divider -->
  <rect x="460" y="254" width="280" height="3" rx="2" fill="url(#accent)" opacity="0.6"/>
  <!-- Tagline -->
  <text x="600" y="316" font-family="Arial,sans-serif" font-size="26" fill="#374151" text-anchor="middle">Suite CRM et facturation pour PME et ETI</text>
  <!-- Features -->
  <rect x="160" y="366" width="240" height="68" rx="12" fill="#f5f3ff"/>
  <text x="280" y="395" font-family="Arial Black,sans-serif" font-size="14" fill="#5b21b6" text-anchor="middle">Pipeline commercial</text>
  <text x="280" y="417" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">et CRM integre</text>
  <rect x="480" y="366" width="240" height="68" rx="12" fill="#f5f3ff"/>
  <text x="600" y="395" font-family="Arial Black,sans-serif" font-size="14" fill="#5b21b6" text-anchor="middle">Relances</text>
  <text x="600" y="417" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">automatiques</text>
  <rect x="800" y="366" width="240" height="68" rx="12" fill="#f5f3ff"/>
  <text x="920" y="395" font-family="Arial Black,sans-serif" font-size="14" fill="#5b21b6" text-anchor="middle">Devis + Factures</text>
  <text x="920" y="417" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">centralises</text>
  <!-- Badge -->
  <rect x="460" y="462" width="280" height="44" rx="22" fill="#5b21b6"/>
  <text x="600" y="490" font-family="Arial Black,sans-serif" font-size="16" fill="white" text-anchor="middle">Avis &amp; Test complet 2026</text>
  <!-- Footer -->
