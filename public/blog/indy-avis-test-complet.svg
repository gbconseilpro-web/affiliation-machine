<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3ff"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="180" fill="#7c3aed" opacity="0.07"/>
  <circle cx="80" cy="560" r="140" fill="#a78bfa" opacity="0.06"/>
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <!-- White card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="white" opacity="0.75"/>
  <!-- Logo Indy -->
  <image href="https://www.indy.fr/wp-content/uploads/logo-indy-2.png" x="430" y="130" width="340" height="90"/>
  <!-- Divider -->
  <rect x="460" y="248" width="280" height="3" rx="2" fill="url(#accent)" opacity="0.6"/>
  <!-- Tagline -->
  <text x="600" y="310" font-family="Arial,sans-serif" font-size="26" fill="#374151" text-anchor="middle">La comptabilite autonome pour independants</text>
  <!-- Features -->
  <rect x="160" y="360" width="240" height="68" rx="12" fill="#f5f3ff"/>
  <text x="280" y="389" font-family="Arial Black,sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">Alertes seuil TVA</text>
  <text x="280" y="411" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">en temps reel</text>
  <rect x="480" y="360" width="240" height="68" rx="12" fill="#f5f3ff"/>
  <text x="600" y="389" font-family="Arial Black,sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">Declarations URSSAF</text>
  <text x="600" y="411" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">automatisees</text>
  <rect x="800" y="360" width="240" height="68" rx="12" fill="#f5f3ff"/>
  <text x="920" y="389" font-family="Arial Black,sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">Synchronisation</text>
  <text x="920" y="411" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">bancaire incluse</text>
  <!-- Badge -->
  <rect x="460" y="462" width="280" height="44" rx="22" fill="#7c3aed"/>
  <text x="600" y="490" font-family="Arial Black,sans-serif" font-size="16" fill="white" text-anchor="middle">Avis &amp; Test complet 2026</text>
  <!-- Footer -->
  <text x="1120" y="610" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="end">facturationpro.com</text>
</svg>
