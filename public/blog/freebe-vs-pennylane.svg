<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#f0fdf4"/>
    </linearGradient>
    <linearGradient id="splitL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#6FBBFF"/>
    </linearGradient>
    <linearGradient id="splitR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006666"/>
      <stop offset="100%" style="stop-color:#00c896"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="600" height="630" fill="#eff6ff" opacity="0.5"/>
  <rect x="600" y="0" width="600" height="630" fill="#f0fdf4" opacity="0.5"/>
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="white" opacity="0.88"/>

  <!-- VS separator -->
  <circle cx="600" cy="210" r="38" fill="#1e1b4b"/>
  <text x="600" y="223" font-family="Arial Black,sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="900">VS</text>

  <!-- Freebe side -->
  <text x="300" y="185" font-family="Arial Black,sans-serif" font-size="58" font-weight="900" fill="#1a56db" text-anchor="middle" letter-spacing="-2">freebe</text>
  <text x="300" y="224" font-family="Arial,sans-serif" font-size="17" fill="#6b7280" text-anchor="middle">Pour les freelances purs</text>

  <!-- Pennylane side -->
  <text x="900" y="185" font-family="Arial Black,sans-serif" font-size="52" font-weight="900" fill="#006666" text-anchor="middle" letter-spacing="-1">pennylane</text>
  <text x="900" y="224" font-family="Arial,sans-serif" font-size="17" fill="#6b7280" text-anchor="middle">Pour les SASU/EURL avec EC</text>

  <!-- Comparison table header -->
  <rect x="130" y="268" width="940" height="44" rx="8" fill="#f8fafc"/>
  <text x="600" y="296" font-family="Arial Black,sans-serif" font-size="16" fill="#374151" text-anchor="middle">Comparatif complet 2026 : prix, fonctionnalites, e-facturation</text>

  <!-- Features comparison -->
  <rect x="130" y="328" width="430" height="62" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="345" y="356" font-family="Arial Black,sans-serif" font-size="14" fill="#1a56db" text-anchor="middle">Dedie freelances</text>
  <text x="345" y="378" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Suivi temps + notes de frais</text>

  <rect x="640" y="328" width="430" height="62" rx="10" fill="#f0fdf4" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="855" y="356" font-family="Arial Black,sans-serif" font-size="14" fill="#006666" text-anchor="middle">Collaboration EC</text>
  <text x="855" y="378" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Compta complete + bilan</text>

  <rect x="130" y="405" width="430" height="62" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="345" y="433" font-family="Arial Black,sans-serif" font-size="14" fill="#1a56db" text-anchor="middle">A partir de 9.90 euro/mois</text>
  <text x="345" y="455" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Gratuit jusqu'a 20 factures</text>

  <rect x="640" y="405" width="430" height="62" rx="10" fill="#f0fdf4" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="855" y="433" font-family="Arial Black,sans-serif" font-size="14" fill="#006666" text-anchor="middle">A partir de 26 euro/mois</text>
  <text x="855" y="455" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Essai gratuit 30 jours</text>

  <!-- CTA -->
  <rect x="380" y="488" width="440" height="48" rx="24" fill="#1e1b4b"/>
  <text x="600" y="517" font-family="Arial Black,sans-serif" font-size="17" fill="white" text-anchor="middle">Comparatif complet 2026</text>

  <text x="1140" y="615" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="end">facturationpro.com</text>
</svg>
