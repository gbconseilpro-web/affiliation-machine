  <rect x="218" y="304" width="6" height="6" rx="1" fill="#0ea5e9" opacity="0.4"/>
  <!-- Fleche cloud upload -->
  <path d="M420 220 L420 160" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
