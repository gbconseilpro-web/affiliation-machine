  <path d="M500 200 L560 200" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="560,193 575,200 560,207" fill="#059669"/>
  <!-- Destinataire -->
  <rect x="580" y="160" width="140" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/>
