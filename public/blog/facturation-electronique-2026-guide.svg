  <text x="650" y="206" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Chorus Pro</text>
  <rect x="598" y="216" width="104" height="8" rx="3" fill="#e5e7eb"/>
  <rect x="598" y="230" width="80" height="8" rx="3" fill="#e5e7eb"/>
