<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#fff7f7"/>
  <!-- Grand X alerte centré gauche -->
  <circle cx="200" cy="200" r="90" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
  <line x1="155" y1="155" x2="245" y2="245" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
  <line x1="245" y1="155" x2="155" y2="245" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
  <!-- Numéro d'erreur badge -->
  <rect x="100" y="80" width="50" height="30" rx="15" fill="#ef4444"/>
  <text x="125" y="100" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">7</text>
  <text x="158" y="100" font-family="Arial, sans-serif" font-size="13" fill="#ef4444" font-weight="bold">erreurs</text>
  <!-- Liste erreurs -->
  <rect x="330" y="70" width="400" height="310" rx="12" fill="white" stroke="#fee2e2" stroke-width="2"/>
  <rect x="330" y="70" width="400" height="40" rx="12" fill="#ef4444"/>
  <rect x="330" y="96" width="400" height="14" fill="#ef4444"/>
  <text x="530" y="96" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Erreurs a eviter absolument</text>
  <!-- Erreur 1 -->
  <rect x="346" y="120" width="22" height="22" rx="11" fill="#ef4444"/>
  <text x="357" y="136" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">1</text>
  <text x="378" y="136" font-family="Arial, sans-serif" font-size="12" fill="#374151">Numero de facture non sequentiel</text>
  <!-- Erreur 2 -->
  <rect x="346" y="152" width="22" height="22" rx="11" fill="#ef4444" opacity="0.85"/>
  <text x="357" y="168" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">2</text>
  <text x="378" y="168" font-family="Arial, sans-serif" font-size="12" fill="#374151">Oublier les mentions obligatoires</text>
  <!-- Erreur 3 -->
  <rect x="346" y="184" width="22" height="22" rx="11" fill="#ef4444" opacity="0.7"/>
  <text x="357" y="200" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">3</text>
  <text x="378" y="200" font-family="Arial, sans-serif" font-size="12" fill="#374151">Confondre HT et TTC</text>
  <!-- Erreur 4 -->
  <rect x="346" y="216" width="22" height="22" rx="11" fill="#f97316" opacity="0.8"/>
  <text x="357" y="232" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">4</text>
  <text x="378" y="232" font-family="Arial, sans-serif" font-size="12" fill="#374151">Pas de relance pour impayés</text>
  <!-- Erreur 5 -->
  <rect x="346" y="248" width="22" height="22" rx="11" fill="#f97316" opacity="0.6"/>
  <text x="357" y="264" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">5</text>
  <text x="378" y="264" font-family="Arial, sans-serif" font-size="12" fill="#374151">Pas de CGV attachées</text>
  <!-- Erreur 6 -->
  <rect x="346" y="280" width="22" height="22" rx="11" fill="#eab308" opacity="0.7"/>
  <text x="357" y="296" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">6</text>
  <text x="378" y="296" font-family="Arial, sans-serif" font-size="12" fill="#374151">Date incorrecte ou manquante</text>
  <!-- Erreur 7 -->
  <rect x="346" y="312" width="22" height="22" rx="11" fill="#eab308" opacity="0.5"/>
  <text x="357" y="328" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">7</text>
  <text x="378" y="328" font-family="Arial, sans-serif" font-size="12" fill="#374151">Aucune archive des factures</text>
  <!-- Fleche resolution -->
  <rect x="346" y="346" width="368" height="22" rx="6" fill="#d1fae5"/>
  <text x="530" y="361" font-family="Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle">Un logiciel evite ces 7 erreurs automatiquement</text>
  <!-- Title -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">7 erreurs de facturation a eviter</text>
  <text x="400" y="432" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Guide pratique pour freelances</text>
</svg>