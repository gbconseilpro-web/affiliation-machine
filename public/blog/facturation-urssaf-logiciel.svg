<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#fefefe"/>
  <!-- Formulaire URSSAF -->
  <rect x="100" y="80" width="230" height="290" rx="10" fill="white" stroke="#dc2626" stroke-width="2"/>
  <rect x="100" y="80" width="230" height="50" rx="10" fill="#dc2626"/>
  <rect x="100" y="116" width="230" height="14" fill="#dc2626"/>
  <text x="215" y="113" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">URSSAF</text>
  <!-- Lignes formulaire -->
  <text x="120" y="154" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Chiffre d'affaires</text>
  <rect x="120" y="158" width="190" height="18" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="305" y="171" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="end">3 840 EUR</text>
  <text x="120" y="192" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Periode</text>
  <rect x="120" y="196" width="190" height="18" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="305" y="209" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="end">Nov 2026</text>
  <text x="120" y="232" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Cotisations dues</text>
  <rect x="120" y="236" width="190" height="18" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="305" y="249" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="end" font-weight="bold">869 EUR</text>
  <!-- Taux -->
  <rect x="120" y="266" width="90" height="30" rx="6" fill="#fef3c7"/>
  <text x="165" y="281" font-family="Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Taux micro</text>
  <text x="165" y="291" font-family="Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="bold">22,6%</text>
  <rect x="220" y="266" width="90" height="30" rx="6" fill="#d1fae5"/>
  <text x="265" y="281" font-family="Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle">Versement</text>
  <text x="265" y="291" font-family="Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle" font-weight="bold">Mensuel</text>
  <!-- Bouton declarer -->
  <rect x="120" y="314" width="190" height="30" rx="8" fill="#dc2626"/>
  <text x="215" y="333" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Declarer en ligne</text>
  <!-- Fleche sync -->
  <path d="M340 200 C370 200 380 220 400 220" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="5,3" fill="none"/>
  <polygon points="400,213 415,220 400,227" fill="#4f46e5"/>
  <!-- Logiciel -->
  <rect x="420" y="110" width="260" height="220" rx="12" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <rect x="420" y="110" width="260" height="38" rx="12" fill="#4f46e5"/>
  <rect x="420" y="136" width="260" height="12" fill="#4f46e5"/>
  <text x="550" y="134" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Mon logiciel de facturation</text>
  <!-- Contenu logiciel -->
  <rect x="436" y="160" width="112" height="50" rx="6" fill="#ede9fe"/>
  <text x="492" y="180" font-family="Arial, sans-serif" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="bold">3 840</text>
  <text x="492" y="198" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">CA du mois</text>
  <rect x="556" y="160" width="110" height="50" rx="6" fill="#d1fae5"/>
  <text x="611" y="180" font-family="Arial, sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">869</text>
  <text x="611" y="198" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">A declarer</text>
  <!-- Fleche auto-calc -->
  <text x="550" y="232" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">Calcul automatique</text>
  <rect x="436" y="240" width="228" height="20" rx="5" fill="#4f46e5" opacity="0.1"/>
  <rect x="436" y="240" width="160" height="20" rx="5" fill="#4f46e5" opacity="0.3"/>
  <!-- Badge sync -->
  <text x="550" y="275" font-family="Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle">Export compatible URSSAF</text>
  <text x="550" y="292" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">CSV / PDF auto-rempli</text>
  <!-- Title -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Facturation et URSSAF</text>
  <text x="400" y="432" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Logiciels connectes pour declarer facilement</text>
</svg>