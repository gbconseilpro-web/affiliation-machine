<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#fffbeb"/>
  <!-- Podium -->
  <!-- 2e place -->
  <rect x="180" y="240" width="140" height="120" rx="8" fill="#c0c0c0"/>
  <text x="250" y="280" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">2</text>
  <!-- 1ere place -->
  <rect x="330" y="190" width="140" height="170" rx="8" fill="#f59e0b"/>
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">1</text>
  <!-- 3e place -->
  <rect x="480" y="270" width="140" height="90" rx="8" fill="#cd7f32"/>
  <text x="550" y="310" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">3</text>
  <!-- Base du podium -->
  <rect x="180" y="358" width="440" height="12" rx="4" fill="#d1d5db"/>
  <!-- Logos/noms sur podium -->
  <!-- 2e - Pennylane -->
  <rect x="192" y="190" width="116" height="44" rx="10" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="250" y="208" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">Pennylane</text>
  <text x="250" y="224" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">★★★★</text>
  <!-- 1ere - Freebe avec trophee -->
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">🏆</text>
  <rect x="342" y="140" width="116" height="44" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="158" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">Freebe</text>
  <text x="400" y="174" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">★★★★★</text>
  <!-- 3e - Indy -->
  <rect x="492" y="220" width="116" height="44" rx="10" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="550" y="238" font-family="Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="bold">Indy</text>
  <text x="550" y="254" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">★★★★</text>
  <!-- Badge choix de la redac -->
  <rect x="50" y="130" width="120" height="48" rx="10" fill="#4f46e5"/>
  <text x="110" y="152" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Choix</text>
  <text x="110" y="168" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">de la redac</text>
  <path d="M170 154 L180 154" stroke="#4f46e5" stroke-width="2"/>
  <!-- Criteres note -->
  <text x="90" y="240" font-family="Arial, sans-serif" font-size="11" fill="#374151">Criteres :</text>
  <text x="90" y="258" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Facilite</text>
  <text x="90" y="274" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Conformite</text>
  <text x="90" y="290" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Prix</text>
  <text x="90" y="306" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Support</text>
  <!-- Title -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Meilleur logiciel de facturation freelance</text>
  <text x="400" y="432" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Classement et comparatif 2026</text>
</svg>