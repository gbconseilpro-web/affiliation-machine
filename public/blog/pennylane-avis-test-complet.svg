  <!-- Title block -->
  <rect x="240" y="80" width="510" height="290" rx="12" fill="white" opacity="0.7"/>
  <text x="270" y="130" font-family="Arial Black,sans-serif" font-size="24" font-weight="900" fill="#064e3b">Pennylane</text>
  <text x="270" y="160" font-family="Arial,sans-serif" font-size="14" fill="#6b7280">Avis &amp; test complet 2026</text>
