<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006666"/>
      <stop offset="100%" style="stop-color:#00c896"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006666"/>
      <stop offset="100%" style="stop-color:#00F872"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="200" fill="#00F872" opacity="0.08"/>
  <circle cx="80" cy="560" r="150" fill="#006666" opacity="0.07"/>
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <!-- White card -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="white" opacity="0.82"/>

  <!-- Pennylane logo SVG inline -->
  <!-- P symbol (coin icon) -->
  <circle cx="430" cy="175" r="52" fill="#006666"/>
  <text x="430" y="197" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle">P</text>
  <!-- Pennylane wordmark -->
  <text x="502" y="204" font-family="Arial Black,sans-serif" font-size="58" font-weight="900" fill="#006666" letter-spacing="-1">pennylane</text>

  <!-- Divider -->
  <rect x="380" y="248" width="440" height="3" rx="2" fill="url(#accent)" opacity="0.7"/>

  <!-- Tagline -->
  <text x="600" y="296" font-family="Arial,sans-serif" font-size="24" fill="#374151" text-anchor="middle">Comptabilite collaborative pour freelances et TPE</text>

  <!-- Note badge -->
  <rect x="516" y="318" width="168" height="36" rx="18" fill="#006666"/>
  <text x="600" y="341" font-family="Arial Black,sans-serif" font-size="15" fill="white" text-anchor="middle">Note : 4,3/5</text>

  <!-- Features row -->
  <rect x="130" y="378" width="260" height="72" rx="14" fill="#f0fdf4" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="260" y="408" font-family="Arial Black,sans-serif" font-size="14" fill="#006666" text-anchor="middle">Synchronisation bancaire</text>
  <text x="260" y="430" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">automatique</text>

  <rect x="470" y="378" width="260" height="72" rx="14" fill="#f0fdf4" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="600" y="408" font-family="Arial Black,sans-serif" font-size="14" fill="#006666" text-anchor="middle">Collaboration</text>
  <text x="600" y="430" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">expert-comptable</text>

  <rect x="810" y="378" width="260" height="72" rx="14" fill="#f0fdf4" stroke="#d1fae5" stroke-width="1.5"/>
  <text x="940" y="408" font-family="Arial Black,sans-serif" font-size="14" fill="#006666" text-anchor="middle">Facturation electronique</text>
  <text x="940" y="430" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ready 2026</text>

  <!-- CTA Badge -->
  <rect x="430" y="472" width="340" height="50" rx="25" fill="#006666"/>
  <text x="600" y="502" font-family="Arial Black,sans-serif" font-size="17" fill="white" text-anchor="middle">Avis &amp; Test complet 2026</text>

  <!-- Footer -->
  <text x="1140" y="615" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="end">facturationpro.com</text>
</svg>
