<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="leftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3ff"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
  </defs>
  <!-- Main background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Left panel - Pennylane -->
  <rect x="0" y="0" width="520" height="630" fill="url(#leftBg)" rx="0"/>
  <!-- Right panel - Indy -->
  <rect x="680" y="0" width="520" height="630" fill="url(#rightBg)" rx="0"/>
  <!-- Center VS area -->
  <rect x="510" y="0" width="180" height="630" fill="white"/>
  <!-- VS decorative circles -->
  <circle cx="600" cy="315" r="70" fill="#1e3a5f" opacity="0.08"/>
  <circle cx="600" cy="315" r="55" fill="white"/>
  <text x="600" y="334" font-family="Arial Black,sans-serif" font-size="36" font-weight="900" fill="#1e293b" text-anchor="middle">VS</text>
  <!-- Vertical dividers -->
  <line x1="510" y1="80" x2="510" y2="550" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="690" y1="80" x2="690" y2="550" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Pennylane logo left -->
  <image href="https://www.pennylane.com/_nuxt/logo.BkRDgVYD.svg" x="80" y="160" width="360" height="72"/>
  <!-- Pennylane features left -->
  <text x="260" y="290" font-family="Arial,sans-serif" font-size="16" fill="#374151" text-anchor="middle">Collaboration expert-comptable</text>
  <text x="260" y="320" font-family="Arial,sans-serif" font-size="16" fill="#374151" text-anchor="middle">Synchronisation bancaire</text>
  <text x="260" y="350" font-family="Arial,sans-serif" font-size="16" fill="#374151" text-anchor="middle">Factures electroniques 2026</text>
  <text x="260" y="380" font-family="Arial,sans-serif" font-size="16" fill="#374151" text-anchor="middle">A partir de 26€/mois</text>
  <!-- Pennylane badge -->
  <rect x="100" y="460" width="260" height="44" rx="22" fill="#006666" opacity="0.9"/>
  <text x="230" y="488" font-family="Arial Black,sans-serif" font-size="14" fill="white" text-anchor="middle">Idéal : avec expert-comptable</text>
  <!-- Indy logo right -->
  <image href="https://www.indy.fr/wp-content/uploads/logo-indy-2.png" x="750" y="155" width="380" height="82"/>
  <!-- Indy features right -->
  <text x="940" y="290" font-family="Arial,sans-serif" font-size="16" fill="#374151" text-anchor="middle">Alertes seuil TVA temps reel</text>
  <text x="940" y="320" font-family="Arial,sans-serif" font-size="16" fill="#374151" text-anchor="middle">Declarations URSSAF auto</text>
  <text x="940" y="350" font-family="Arial,sans-serif" font-size="16" fill="#374151" text-anchor="middle">Synchronisation bancaire</text>
  <text x="940" y="380" font-family="Arial,sans-serif" font-size="16" fill="#374151" text-anchor="middle">A partir de 7€/mois</text>
  <!-- Indy badge -->
  <rect x="840" y="460" width="260" height="44" rx="22" fill="#7c3aed" opacity="0.9"/>
  <text x="970" y="488" font-family="Arial Black,sans-serif" font-size="14" fill="white" text-anchor="middle">Idéal : micro-entrepreneur</text>
  <!-- Bottom title -->
  <rect x="200" y="548" width="800" height="50" rx="8" fill="#1e293b" opacity="0.07"/>
  <text x="600" y="580" font-family="Arial Black,sans-serif" font-size="22" font-weight="900" fill="#1e293b" text-anchor="middle">Comparatif complet 2026 : Pennylane vs Indy</text>
  <!-- Footer -->
  <text x="1120" y="618" font-family="Arial,sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">facturationpro.com</text>
</svg>
