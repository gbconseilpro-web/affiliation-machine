  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="180" fill="#fb7185" opacity="0.1"/>
  <circle cx="80" cy="560" r="140" fill="#be123c" opacity="0.07"/>
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <!-- White card -->
