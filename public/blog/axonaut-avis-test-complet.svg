  <!-- Tagline -->
  <text x="600" y="314" font-family="Arial,sans-serif" font-size="26" fill="#374151" text-anchor="middle">CRM + Facturation + Compta tout-en-un pour TPE</text>
  <!-- Features -->
  <rect x="160" y="364" width="240" height="68" rx="12" fill="#fff1f2"/>
  <text x="280" y="393" font-family="Arial Black,sans-serif" font-size="14" fill="#be123c" text-anchor="middle">CRM integre</text>
  <text x="280" y="415" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">pipeline commercial</text>
  <rect x="480" y="364" width="240" height="68" rx="12" fill="#fff1f2"/>
  <text x="600" y="393" font-family="Arial Black,sans-serif" font-size="14" fill="#be123c" text-anchor="middle">Devis et factures</text>
  <text x="600" y="415" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">personnalises</text>
  <rect x="800" y="364" width="240" height="68" rx="12" fill="#fff1f2"/>
  <text x="920" y="393" font-family="Arial Black,sans-serif" font-size="14" fill="#be123c" text-anchor="middle">100% francais</text>
  <text x="920" y="415" font-family="Arial,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">RGPD &amp; hebergement FR</text>
