name: Deploy via sshpass

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via SSH password
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            root@${{ secrets.VPS_HOST }} \
            'set -e
            source /root/.nvm/nvm.sh 2>/dev/null || export PATH=$PATH:/root/.nvm/versions/node/v20.18.0/bin

            if [ -d /tmp/affiliation-machine ]; then
              cd /tmp/affiliation-machine && git pull origin main
            else
              git clone https://github.com/gbconseilpro-web/affiliation-machine.git /tmp/affiliation-machine
              cd /tmp/affiliation-machine
            fi

            npm ci --production=false 2>&1 | tail -3
            npm run build 2>&1 | tail -20

            pm2 list | grep -q affiliation && pm2 restart affiliation --update-env || pm2 start ecosystem.config.js
            pm2 save
            echo "DEPLOY OK $(date)"'

      - name: Verify all pages
        run: |
          sleep 15
          HOST="${{ secrets.VPS_HOST }}"
          ALL_OK=true
          for slug in "" "logiciel-facturation" "devis-gratuit" "micro-entrepreneur" "facture-en-ligne"; do
            url="http://${HOST}/${slug}"
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "FAIL")
            echo "$url => $status"
            [ "$status" = "200" ] || ALL_OK=false
          done
          $ALL_OK && echo "ALL PAGES OK" || { echo "SOME PAGES FAILED"; exit 1; }
