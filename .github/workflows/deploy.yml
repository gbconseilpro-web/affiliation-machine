name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 149.56.210.132
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash /home/ubuntu/affiliation-machine/scripts/deploy.sh

      - name: Health check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://facturationpro.com)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERREUR : le site repond $STATUS apres le deploy !"
            exit 1
          fi
          echo "Site OK (200)"
