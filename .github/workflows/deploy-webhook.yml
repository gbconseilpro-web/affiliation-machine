name: Deploy via Webhook (no SSH needed)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via /api/deploy webhook (pull + build + PM2 restart)
        run: |
          echo "Calling /api/deploy to pull, build and restart..."
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"token":"claude-deploy-2026-secret"}' \
            --max-time 400 \
            "http://${{ secrets.VPS_HOST }}/api/deploy" || echo '{"ok":false,"err":"curl failed"}')
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { echo "DEPLOY FAILED"; echo "$RESPONSE"; exit 1; }
          echo "Deploy + PM2 restart OK!"

      - name: Verify all pages are live
        run: |
          sleep 15
          HOST="${{ secrets.VPS_HOST }}"
          ALL_OK=true
          for path in "/" "/logiciel-facturation" "/devis-gratuit" "/micro-entrepreneur" "/facture-en-ligne"; do
            url="http://${HOST}${path}"
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "FAIL")
            echo "$url => $status"
            [ "$status" = "200" ] || ALL_OK=false
          done
          $ALL_OK && echo "ALL PAGES OK" || { echo "SOME PAGES FAILED"; exit 1; }
