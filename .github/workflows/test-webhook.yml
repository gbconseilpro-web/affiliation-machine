name: Test Webhook Deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test connectivity to VPS port 80
        run: |
          echo "Testing VPS port 80..."
          curl -v --max-time 10 "http://${{ secrets.VPS_HOST }}/" 2>&1 || true
          
      - name: Try webhook on port 80
        run: |
          echo "Testing webhook via port 80..."
          curl -v --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"token":"claude-deploy-2026-secret"}' \
            "http://${{ secrets.VPS_HOST }}/api/deploy" 2>&1 || true
            
      - name: Try webhook on port 3000
        run: |
          echo "Testing webhook via port 3000..."
          curl -v --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"token":"claude-deploy-2026-secret"}' \
            "http://${{ secrets.VPS_HOST }}:3000/api/deploy" 2>&1 || true
